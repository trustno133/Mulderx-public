Run the reachability gate first (step 2b of the skill) -- without an identified reachability path for the ID, the vector is DEAD and you stop before building the two-account protocol. If it passes, run the full protocol: two same-privilege accounts -> baseline -> mutation with the attacker's session -> verify from the victim account -> every verb, not just GET. For GraphQL, start with introspection and check that nested relationships re-check ownership, not just the top-level resolver.

